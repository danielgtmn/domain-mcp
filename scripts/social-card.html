<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>domain-mcp social card</title>
    <style>
      @font-face {
        font-family: "Bricolage";
        src: url("../src/domain_mcp/web/fonts/bricolage-600.woff2") format("woff2");
        font-weight: 600;
        font-style: normal;
      }
      @font-face {
        font-family: "Public Sans";
        src: url("../src/domain_mcp/web/fonts/public-sans-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      @font-face {
        font-family: "IBM Plex Mono";
        src: url("../src/domain_mcp/web/fonts/ibm-plex-mono-400.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background: #dce4df;
        color: #17211e;
      }

      /* GitHub crops the outer ~40pt. Keep every important mark inside this inset. */
      .safe {
        position: absolute;
        inset: 56px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
      }

      img {
        width: 112px;
        height: 112px;
        border-radius: 26px;
        margin-bottom: 28px;
      }

      h1 {
        font-family: "Bricolage", "Public Sans", sans-serif;
        font-weight: 600;
        font-size: 84px;
        letter-spacing: -0.05em;
        line-height: 0.92;
      }

      p {
        margin-top: 18px;
        font-family: "Public Sans", sans-serif;
        font-size: 28px;
        line-height: 1.3;
        color: #56615c;
        max-width: 920px;
      }

      code {
        display: block;
        margin-top: 28px;
        font-family: "IBM Plex Mono", ui-monospace, monospace;
        font-size: 22px;
        color: #1c6b50;
        letter-spacing: -0.02em;
      }
    </style>
  </head>
  <body>
    <div class="safe">
      <img src="../docs/assets/logo-256.png" width="112" height="112" alt="" />
      <h1>domain-mcp</h1>
      <p>MCP server for domain availability. RDAP first, WHOIS if needed.</p>
      <code>domain.mcp.danielgtmn.com</code>
    </div>
  </body>
</html>
